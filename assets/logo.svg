<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" role="img" aria-label="字棧 ZiZaan">
  <title>字棧 ZiZaan</title>
  <!-- Mark: stacked blocks (棧) + character stroke hint -->
  <g transform="translate(8,12)">
    <rect x="0" y="0" width="96" height="96" rx="18" fill="#0f2744"/>
    <!-- three stacked bars suggesting 棧 / depot shelves -->
    <rect x="18" y="22" width="60" height="12" rx="3" fill="#f7f5f1"/>
    <rect x="18" y="42" width="60" height="12" rx="3" fill="#c45c26"/>
    <rect x="18" y="62" width="40" height="12" rx="3" fill="#f7f5f1"/>
    <!-- small vertical tick = pen/ink accent -->
    <rect x="68" y="62" width="10" height="12" rx="2" fill="#c45c26"/>
  </g>
  <!-- Wordmark -->
  <text x="128" y="58" font-family="'Noto Sans TC','PingFang HK','Microsoft JhengHei',sans-serif" font-size="42" font-weight="700" fill="#0f2744">字棧</text>
  <text x="128" y="92" font-family="'Source Sans 3','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="0.12em" fill="#1a4a6e">ZiZaan</text>
</svg>
